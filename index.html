<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contributors</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #db2777);
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #4f46e5;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
      font-size: 15px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f5f3ff;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    li:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
    }

    .name {
      font-weight: 600;
      font-size: 17px;
    }

    .id {
      background: #4f46e5;
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      direction: ltr;
    }

    footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Team Members</h1>
    <p class="subtitle">الأسماء والـ IDs</p>

    <ul>
      <li><span class="name">Mohamed Motaz Maher</span><span class="id">ID: 20240529</span></li>
    </ul>

    <footer>Deployed with GitHub Actions 🚀</footer>
  </div>
</body>
</html>

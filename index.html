<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Software Engineering Lab Task 1: CI/CD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background-color: #1e1e1e;
      border-radius: 14px;
      padding: 36px 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .task-title {
      display: block;
      margin-top: 4px;
      font-size: 19px;
      font-weight: 600;
      color: #ffffff;
    }

    .ta {
      font-size: 14px;
      font-weight: 500;
      color: #a3a3a3;
      margin-bottom: 24px;
    }

    .ta-name {
      color: #ffffff;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 500;
      color: #737373;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background-color: #282828;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: background-color 0.15s ease;
    }

    li:last-child {
      margin-bottom: 0;
    }

    li:hover {
      background-color: #333333;
    }

    .name {
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
    }

    .id {
      background-color: #3d3d3d;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>Advanced Software Engineering<span class="task-title">Lab Task 1: CI/CD</span></h1>
      <p class="ta">TA: <span class="ta-name">Ahmed Ehab</span></p>
      <p class="subtitle">Team Members</p>
    </div>
    <ul>
      <li>
        <span class="name">Mohamed Motaz Maher</span>
        <span class="id">ID: 20240529</span>
      </li>
      <li>
        <span class="name">Yehia Hassan Abdelmoaty</span>
        <span class="id">ID: 20242447</span>
      </li>
    </ul>
  </div>
</body>

</html>
